name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo test --workspace --exclude editor-app
      - run: brew install cargo-deny && cargo deny check licenses
      - run: scripts/check-clean.sh
      - name: Import signing certificate
        if: ${{ env.APPLE_CERTIFICATE_P12 != '' }}
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Build installer
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/make-dmg.sh | tee build.log
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          signature="$(sed -n 's/^Signature: //p' build.log)"
          notes="Signature: $signature. See README for install steps."
          if [[ "$signature" == *unnotarized* ]]; then title="$GITHUB_REF_NAME (unnotarized)"; else title="$GITHUB_REF_NAME"; fi
          gh release create "$GITHUB_REF_NAME" dist/* --draft --prerelease --title "$title" --notes "$notes"
