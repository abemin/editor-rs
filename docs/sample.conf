#config-version=FGT60F-7.4.4-FW-build2662-240514:opmode=0:vdom=0
# Sample for screenshots. Every name, address and secret is made up.
config system global
    set hostname "edge-fw-01"
    set admin-sport 8443
end
config system interface
    edit "lan"
        set ip 192.0.2.1 255.255.255.0
        set allowaccess ping https ssh
        set status enable
    next
end
config firewall address
    edit "v6-office"
        set subnet6 2001:db8:10::/48
        set comment "Branch office"
    next
end
config user local
    edit "operator"
        set passwd ENC SH2c2FtcGxlLW5vdC1hLXJlYWwtc2VjcmV0
    next
end
config waf signature
    edit "web-default"
            config main_class_list
                edit "030000000"
                    set action alert_deny
                    set severity High
                next
                edit "050000000"
                    set action alert
                    set severity Medium
                    set status disable
                next
            end
    next
end
config log syslogd setting
    set status enable
    set server "logs.example.com"
    set port 514
end
